name: Android Release
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release da creare/aggiornare (es. 0.0.2 o v0.0.2)'
        required: false
        type: string
      release_name:
        description: 'Titolo release (opzionale)'
        required: false
        type: string
  push:
    branches: [main]
    paths: ["release-notes-*.md"]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${REQUESTED_TAG:-v${version}}"
          fi
          if [[ ! "${tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${tag}"
            exit 1
          fi
          if [[ "${tag#v}" != "${version}" ]]; then
            echo "Release tag does not match package version ${version}"
            exit 1
          fi
          notes="release-notes-${tag#v}.md"
          test -f "${notes}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          required_vars=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "Missing required signing secret: ${var_name}"
              exit 1
            fi
          done

          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release-keystore.jks

          {
            echo "storeFile=release-keystore.jks"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > android/app/keystore.properties

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build Android release
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare signed APK for distribution
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          signed_apk="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${signed_apk}" ]; then
            echo "Signed APK not found at ${signed_apk}"
            ls -la android/app/build/outputs/apk/release || true
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          cp "${signed_apk}" "android/app/build/outputs/apk/release/torna-a-casa-${version}.apk"
          sha256sum "android/app/build/outputs/apk/release/torna-a-casa-${version}.apk" > android/app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: |
            android/app/build/outputs/apk/release/torna-a-casa-*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ github.event.inputs.release_name || format('Torna a Casa {0}', steps.release.outputs.tag) }}
          body_path: ${{ steps.release.outputs.notes }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/torna-a-casa-*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
