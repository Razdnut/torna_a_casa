name: Export Dependabot alerts

on:
  workflow_dispatch:


# `vulnerability-alerts: read` grants the workflow token access to the
# repository's Dependabot alert endpoint. No personal access token is needed.
permissions:
  contents: read
  vulnerability-alerts: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Download open Dependabot alerts
        id: download
        env:
          GH_TOKEN: ${{secrets.GH_TOKEN}}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependabot-report

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
            --jq '.[]' > dependabot-report/open-alerts.ndjson

          jq -s '.' dependabot-report/open-alerts.ndjson > dependabot-report/open-alerts.json

      - name: Build CSV and summary
        shell: bash
        run: |
          set -euo pipefail

          jq -r '
            def csvsafe:
              tostring | if test("^[=+@-]") then "'\''" + . else . end;
            ([
              "alert_number", "severity", "package", "ecosystem", "scope",
              "manifest_path", "summary", "ghsa_id", "cve_id",
              "first_patched_version", "created_at", "updated_at", "url"
            ] | map(csvsafe) | @csv),
            (
              .[] | [
                .number,
                .security_advisory.severity,
                .dependency.package.name,
                .dependency.package.ecosystem,
                .dependency.scope,
                .dependency.manifest_path,
                .security_advisory.summary,
                .security_advisory.ghsa_id,
                (.security_advisory.cve_id // ""),
                (.security_vulnerability.first_patched_version.identifier // ""),
                .created_at,
                .updated_at,
                .html_url
              ] | map(csvsafe) | @csv
            )
          ' dependabot-report/open-alerts.json > dependabot-report/open-alerts.csv

          {
            echo "# Dependabot alerts"
            echo
            echo "Generated: $(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Open alerts by severity"
            echo
            echo "| Severity | Count |"
            echo "| --- | ---: |"
            jq -r 'group_by(.security_advisory.severity) | sort_by(.[0].security_advisory.severity)[] | "| \(.[0].security_advisory.severity) | \(length) |"' dependabot-report/open-alerts.json
            echo
            echo "## Open alerts"
            echo
            echo "| # | Severity | Package | Scope | Advisory |"
            echo "| ---: | --- | --- | --- | --- |"
            jq -r '.[] | "| \(.number) | \(.security_advisory.severity) | \(.dependency.package.name) | \(.dependency.scope) | [\(.security_advisory.ghsa_id)](\(.html_url)) |"' dependabot-report/open-alerts.json
          } > dependabot-report/README.md

      - name: Publish report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-alert-report
          path: dependabot-report/
          if-no-files-found: error
          retention-days: 30
