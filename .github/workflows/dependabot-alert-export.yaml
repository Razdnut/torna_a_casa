name: dependabot-alert-export

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
            - name: Dependabot Alert CSV Export
            # You may pin to the exact commit or the version.
            # uses: ShamKarthikS-Hexaware/dependabot-alert-export@d023a5865560e0a3c26601c8f7be5d6c5639453a
              uses: ShamKarthikS-Hexaware/dependabot-alert-export@v1.0
              with:
                # GitHub token
                GITHUB_TOKEN: ${{secrets.GH_TOKEN}}
                # Organization name
                org_name: 'Razdnut'
                # Repository name
                repo_name: 'torna_a_casa'
                # CSV File path
                csv_path: data/vulnerability.csv
                          
            - name: Upload Vulnerability report
              uses: actions/upload-artifact@v4
              with:
                 name: vulnerability_report
                 path: data/vulnerability.csv
